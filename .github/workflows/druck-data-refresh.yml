name: Druck data refresh

on:
  # 21:45 UTC on weekdays = after the US cash close (16:00 ET), once Yahoo has
  # the closing prints and FRED has the day's rates. Intraday prices on the
  # page come from /api/druck/live/, not from this file.
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: druck-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-druck.txt

      - name: Fetch Druck data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python backend/scripts/fetch_druck_data.py frontend/public/data/druck.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/druck.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(druck): daily data refresh $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 15
            done
            exit 1
          fi
